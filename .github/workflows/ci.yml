name: CI

on:
  push:
    branches:
      - develop

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false

      - name: Go vet
        run: go vet ./...

      - name: Go test with race detector
        run: go test -race ./...

      - name: Build binary
        run: go build -o bin/payments ./cmd/api

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: payments-binary
          path: bin/payments
          if-no-files-found: error
